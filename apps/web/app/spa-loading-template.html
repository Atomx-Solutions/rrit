<div
  role="status"
  aria-live="polite"
  style="
    min-height: 100vh;
    display: grid;
    place-content: center;
    gap: 16px;
    text-align: center;
    font:
      14px system-ui,
      sans-serif;
    background: #f7f8fa;
    color: #202822;
  "
>
  <img src="/favicon.svg" width="44" height="44" alt="" style="margin: auto" />
  <strong data-loading-locale="sq">Po përgatisim hapësirën tënde…</strong>
  <strong data-loading-locale="en" hidden>Preparing your workspace…</strong>
  <noscript>
    <span data-loading-locale="sq">Aktivizo JavaScript për hapësirën e punës. Faqja publike është e lexueshme edhe pa të.</span>
    <span data-loading-locale="en" hidden>Enable JavaScript for your workspace. The public site is still readable without it.</span>
  </noscript>
  <script>
    (() => {
      const locale = document.cookie.match(/(?:^|; )rrit-locale=([^;]+)/)?.[1] || 'sq-XK'
      const language = decodeURIComponent(locale).toLowerCase().startsWith('en') ? 'en' : 'sq'
      document.documentElement.lang = language
      document.querySelectorAll('[data-loading-locale]').forEach((element) => {
        element.hidden = element.dataset.loadingLocale !== language
      })
    })()
  </script>
</div>
