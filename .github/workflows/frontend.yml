name: Frontend quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: rrit_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rrit_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rrit_ci
      APP_URL: http://127.0.0.1:3000
      HOST: 127.0.0.1
      PORT: '3000'
      AUTH_REQUIRE_EMAIL_VERIFICATION: 'false'
      TRIAL_HASH_KEY: ci-only-trial-hash-key-at-least-thirty-two-characters
      META_TOKEN_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      MEDIA_SIGNING_KEY: ci-only-media-signing-key-at-least-thirty-two-characters
      PUBLISHING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          check-latest: false
      - run: npm run toolchain:check
      - run: npm ci
      - run: npm run check
      - name: Prepare Supabase auth compatibility schema
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          -c "CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (
          id uuid PRIMARY KEY,
          email text,
          raw_user_meta_data jsonb,
          created_at timestamptz NOT NULL DEFAULT now(),
          updated_at timestamptz NOT NULL DEFAULT now()
          );"
      - run: npm run test:integration
      - run: npm audit --audit-level=moderate
      - run: npm run db:migrate
      - run: npm run build
      - run: node apps/web/scripts/bundle-budget.mjs
      - run: npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          nohup node apps/web/.output/server/index.mjs > apps/web/production-server.log 2>&1 &
          echo $! > apps/web/production-server.pid
      - name: Wait for production readiness
        run: npm exec --workspace apps/web -- wait-on --timeout 120000 --interval 1000 http://127.0.0.1:3000/api/health/ready
      - run: npm run test:e2e
        env:
          TEST_BASE_URL: http://127.0.0.1:3000
      - name: Stop production server
        if: always()
        run: |
          if [ -f apps/web/production-server.pid ]; then
            kill "$(cat apps/web/production-server.pid)" || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-evidence
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/bundle-report.json
            apps/web/production-server.log
