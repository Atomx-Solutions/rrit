name: Frontend quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: rrit_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rrit_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rrit_ci
      APP_URL: http://127.0.0.1:3000
      HOST: 127.0.0.1
      PORT: '3000'
      AUTH_REQUIRE_EMAIL_VERIFICATION: 'false'
      TRIAL_HASH_KEY: ci-only-trial-hash-key-at-least-thirty-two-characters
      META_TOKEN_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      MEDIA_SIGNING_KEY: ci-only-media-signing-key-at-least-thirty-two-characters
      PUBLISHING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          check-latest: false
      - run: npm run toolchain:check
      - run: npm ci
      - name: Install video test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
          ffmpeg -hide_banner -encoders | grep libx264
      - run: npm run check
      - name: Prepare Supabase auth compatibility schema
        run: >-
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1
          -c "CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (
          id uuid PRIMARY KEY,
          email text,
          raw_user_meta_data jsonb,
          created_at timestamptz NOT NULL DEFAULT now(),
          updated_at timestamptz NOT NULL DEFAULT now()
          );"
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run test:security
      - run: npm audit --audit-level=moderate
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - run: node apps/web/scripts/bundle-budget.mjs
      - run: npx playwright install --with-deps chromium
      - name: Validate Supabase E2E configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          for name in SUPABASE_URL SUPABASE_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_DATABASE_URL; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          case "$SUPABASE_KEY" in
            sb_secret_*)
              echo 'SUPABASE_KEY must be the publishable/anon key, not a secret service-role key.'
              exit 1
              ;;
          esac
          curl --fail-with-body --silent --show-error \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/auth/v1/settings" >/dev/null
      - name: Start production server
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MEDIA_BUCKET: assets
          MAINTENANCE_ENABLED: 'false'
        run: |
          nohup node apps/web/.output/server/index.mjs > apps/web/production-server.log 2>&1 &
          echo $! > apps/web/production-server.pid
      - name: Wait for production readiness
        run: |
          if npm exec --workspace apps/web -- wait-on --timeout 120000 --interval 1000 http-get://127.0.0.1:3000/api/health/ready; then
            exit 0
          fi
          echo 'Production readiness timed out. Server diagnostics:'
          if [ -f apps/web/production-server.pid ]; then
            server_pid="$(cat apps/web/production-server.pid)"
            ps -p "$server_pid" -o pid,ppid,stat,cmd || true
          fi
          echo 'Readiness response:'
          curl -i --max-time 10 http://127.0.0.1:3000/api/health/ready || true
          echo 'Production server log:'
          if [ -f apps/web/production-server.log ]; then
            tail -200 apps/web/production-server.log
          else
            echo 'production-server.log was not created'
          fi
          exit 1
      - run: npm run test:e2e
        env:
          TEST_BASE_URL: http://127.0.0.1:3000
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Stop production server
        if: always()
        run: |
          if [ -f apps/web/production-server.pid ]; then
            kill "$(cat apps/web/production-server.pid)" || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-evidence
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/bundle-report.json
            apps/web/production-server.log
